    <input
      id="searchInput"
      type="search"
      placeholder="Search for products, brands and more..."
    >
    <button onclick="searchProducts()">⌕</button>
  </div>

  <button class="header-btn" onclick="openWishlist()">
    ♡ <span class="hide-mobile">Wishlist</span>
  </button>

  <button class="header-btn cart-btn" onclick="openCart()">

  </button>

  <button onclick="filterCategory('Gaming')">

  </button>

  <button onclick="filterCategory('Home')">

  <button onclick="filterCategory('Accessories')">

  </button>

</nav>

  <div class="hero-object">

</section>

  <div>

  </div>

</section>
